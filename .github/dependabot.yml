version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: []
    commit-message:
      prefix: chore(deps)
    groups:
      npm:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /analysis
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: []
    commit-message:
      prefix: chore(deps)
    groups:
      python:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: []
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        update-types: [minor, patch]
